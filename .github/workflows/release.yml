name: Release

# Push a tag like v1.0.0 to build AmbiEdge.exe and AmbiEdge.app and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller pytest
      - run: python -m pytest -q
      - run: python -m ambiedge.icon AmbiEdge.ico
      - run: pyinstaller --noconfirm --onefile --windowed --name AmbiEdge --icon AmbiEdge.ico AmbiEdge.pyw
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/AmbiEdge.exe
          generate_release_notes: true

  build-macos:
    # Apple Silicon build. Intel Macs can run AmbiEdge from source.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller pillow pytest
      - run: python -m pytest -q
      - run: python -m ambiedge.icon AmbiEdge.png
      - run: >
          pyinstaller --noconfirm --windowed --name AmbiEdge --icon AmbiEdge.png
          --osx-bundle-identifier com.korbsoft.ambiedge AmbiEdge.pyw
      # ditto keeps the app bundle's symlinks and signature intact, which a plain zip doesn't.
      - run: ditto -c -k --keepParent dist/AmbiEdge.app dist/AmbiEdge-macOS.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/AmbiEdge-macOS.zip
