name: Release

# Push a tag like v1.0.0 to build AmbiEdge.exe and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller pytest
      - run: python -m pytest -q
      - run: python -m ambiedge.icon AmbiEdge.ico
      - run: pyinstaller --noconfirm --onefile --windowed --name AmbiEdge --icon AmbiEdge.ico AmbiEdge.pyw
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/AmbiEdge.exe
          generate_release_notes: true
