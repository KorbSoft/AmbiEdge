[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ambiedge"
dynamic = ["version"]
description = "Screen-reactive bias lighting (ambilight) for LED strips connected to a PC."
readme = "README.md"
requires-python = ">=3.9"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "KorbSoft" }]
keywords = ["ambilight", "bias lighting", "led strip", "screen sync", "adalight", "wled", "openrgb", "robobloq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "numpy>=1.24",
    "mss>=9.0",
    "hidapi>=0.14",
    "pyserial>=3.5",
    "dxcam>=0.0.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ambiedge = "ambiedge.cli:main"

[project.gui-scripts]
ambiedge-gui = "ambiedge.cli:main"

[project.urls]
Homepage = "https://github.com/KorbSoft/AmbiEdge"
Issues = "https://github.com/KorbSoft/AmbiEdge/issues"

[tool.setuptools.dynamic]
version = { attr = "ambiedge.__version__" }

[tool.setuptools.packages.find]
include = ["ambiedge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
